<!doctype html><meta charset="utf-8"><title>video</title><body style="margin:0;background:#000"><canvas id="c" width="1920" height="1080" style="width:960px;height:540px"></canvas>
<script>
window.__types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].map(function(t){return t+'='+(window.MediaRecorder&&MediaRecorder.isTypeSupported(t))}).join(' | ');
// slides: [{img:'url',sec:number,audio:'url'|''}]
window.__rec=async function(slides,mime,fps){
 const cv=document.getElementById('c'),ctx=cv.getContext('2d'),imgs=[];
 for(const s of slides){const im=new Image();await new Promise(function(r,j){im.onload=r;im.onerror=function(){j('gagal gambar '+s.img)};im.src=s.img});imgs.push(im)}
 const ac=new (window.AudioContext||window.webkitAudioContext)(),dest=ac.createMediaStreamDestination(),bufs=[];
 for(const s of slides){if(s.audio){try{const ab=await (await fetch(s.audio)).arrayBuffer();bufs.push(await ac.decodeAudioData(ab))}catch(e){bufs.push(null)}}else bufs.push(null)}
 slides.forEach(function(s,i){if(bufs[i]){s.sec=Math.max(s.sec,bufs[i].duration+1.2)}});
 const vs=cv.captureStream(0),vtrack=vs.getVideoTracks()[0],stream=new MediaStream();stream.addTrack(vtrack);const hasAudio=bufs.some(function(b){return b});if(hasAudio)dest.stream.getAudioTracks().forEach(function(t){stream.addTrack(t)});if(!hasAudio)mime=mime.replace(/,mp4a[^;]*/,'').replace(/,opus/,'');
 const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:2500000,audioBitsPerSecond:128000}),chunks=[];
 rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
 let fc=0;const draw=function(i,alpha,j){ctx.globalAlpha=1;if(j!=null){ctx.drawImage(imgs[j],0,0,1920,1080)}ctx.globalAlpha=alpha;ctx.drawImage(imgs[i],0,0,1920,1080);ctx.globalAlpha=1;fc++;ctx.fillStyle='rgb('+(fc%2?40:44)+',60,87)';ctx.fillRect(0,0,3,3)};
 ctx.fillStyle='#000';ctx.fillRect(0,0,1920,1080);await ac.resume();
 rec.start(1000);const w0=performance.now()/1000+0.3,ac0=ac.currentTime+0.3;let at=0;
 slides.forEach(function(s,i){if(bufs[i]){const src=ac.createBufferSource();src.buffer=bufs[i];src.connect(dest);src.start(ac0+at+0.5)}at+=s.sec});
 const total=at;
 await new Promise(function(res){
  const tick=function(){const now=performance.now()/1000-w0;if(now>=total){res();return}
   let acc=0,k=0;for(;k<slides.length;k++){if(now<acc+slides[k].sec)break;acc+=slides[k].sec}k=Math.min(k,slides.length-1);const local=now-acc;
   if(k>0&&local<0.5)draw(k,local/0.5,k-1);else draw(k,1,null);
   if(vtrack.requestFrame)vtrack.requestFrame();setTimeout(tick,Math.round(1000/(fps||25)))};tick()});
 await new Promise(function(r){rec.onstop=r;rec.stop()});
 const blob=new Blob(chunks,{type:mime});window.__blob=blob;return 'OK '+blob.size+' detik='+Math.round(total)};
window.__chunk=async function(i,n){const b=window.__blob.slice(i*n,(i+1)*n),ab=await b.arrayBuffer(),u=new Uint8Array(ab);let s='';for(let k=0;k<u.length;k+=8192)s+=String.fromCharCode.apply(null,u.subarray(k,k+8192));return btoa(s)};
</script>
