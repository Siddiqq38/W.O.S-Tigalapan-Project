<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resi dari ERP</title>
<style>
  :root { --brand:#b5532a; --line:#e4e0da; --muted:#6b6560; --bg:#faf8f5; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif; background:var(--bg); color:#2a2622; }
  header { background:var(--brand); color:#fff; padding:14px 20px; font-weight:600; font-size:16px; }
  main { max-width:1100px; margin:0 auto; padding:16px 20px 40px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:end; margin-bottom:14px; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:3px; }
  input { padding:7px 9px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  button { padding:8px 14px; border:0; border-radius:6px; background:var(--brand); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  .msg { margin:10px 0; color:var(--muted); }
  .msg.err { color:#b3261e; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th, td { padding:9px 11px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { background:#f3ede6; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  td.num, th.num { text-align:right; }
  tr.resi { cursor:pointer; }
  tr.resi:hover { background:#fdf7f1; }
  tr.detail td { background:#faf8f5; padding:12px 16px; }
  .koli { margin:0 0 10px; }
  .koli b { margin-right:8px; }
  .items { width:100%; margin-top:4px; }
  .items th, .items td { padding:5px 8px; font-size:13px; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; background:#eee7df; font-size:12px; }
  a { color:var(--brand); }
</style>
</head>
<body>
<header>Resi dari ERP Tigalapan</header>
<main>
  <div class="bar" id="loginBar">
    <label>Kata sandi<input id="pw" type="password" autocomplete="current-password"></label>
    <button id="btnLogin">Masuk</button>
  </div>
  <div class="bar" id="filterBar" hidden>
    <label>Dari tanggal kirim<input id="from" type="date"></label>
    <label>Sampai<input id="to" type="date"></label>
    <label>Cari resi / vendor<input id="q" placeholder="mis. AWB123 atau CECEP"></label>
    <button id="btnLoad">Tampilkan</button>
    <button id="btnOut" class="ghost">Keluar</button>
  </div>
  <div class="msg" id="msg"></div>
  <table id="tbl" hidden>
    <thead><tr><th>No. resi</th><th>Vendor</th><th>Ekspedisi</th><th>Tgl kirim</th><th>MRP</th><th class="num">Koli</th><th class="num">Qty</th><th>Lampiran</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var open = {};
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function say(t, err) { $('msg').textContent = t || ''; $('msg').className = 'msg' + (err ? ' err' : ''); }
  function pw() { try { return sessionStorage.getItem('erpResiPw') || ''; } catch (e) { return ''; } }
  function setPw(v) { try { if (v) sessionStorage.setItem('erpResiPw', v); else sessionStorage.removeItem('erpResiPw'); } catch (e) {} }
  function show(loggedIn) { $('loginBar').hidden = loggedIn; $('filterBar').hidden = !loggedIn; if (!loggedIn) $('tbl').hidden = true; }

  function detail(r) {
    var h = '';
    (r.erp_resi_koli || []).sort(function (a, b) { return String(a.koli_no).localeCompare(String(b.koli_no), undefined, { numeric: true }); }).forEach(function (k) {
      h += '<div class="koli"><b>Koli ' + esc(k.koli_no) + '</b><span class="tag">MRP ' + esc(k.mrp_no) + '</span> ' + (k.weight_kg != null ? esc(k.weight_kg) + ' kg' : '') +
        '<table class="items"><thead><tr><th>Item (warna · lengan · size)</th><th>SKU</th><th>Jenis</th><th class="num">Qty</th></tr></thead><tbody>';
      (k.erp_resi_item || []).forEach(function (i) {
        h += '<tr><td>' + esc(i.color) + ' · ' + esc(i.sleeve) + ' · ' + esc(i.size) + '</td><td>' + esc(i.sku || '—') + '</td><td>' + esc(i.kind) + '</td><td class="num">' + esc(i.qty) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    });
    if (r.note) h += '<div>Catatan ekspedisi: ' + esc(r.note) + '</div>';
    return h || 'Tidak ada koli.';
  }

  function draw(rows) {
    var out = '';
    rows.forEach(function (r) {
      var files = (r.attachments || []).map(function (a, i) { return a.url ? '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">Foto ' + (i + 1) + '</a>' : ''; }).filter(Boolean).join(' · ');
      out += '<tr class="resi" data-id="' + esc(r.resi_group_id) + '"><td><b>' + esc(r.resi_no) + '</b></td><td>' + esc(r.vendor_name) + '</td><td>' + esc(r.expedition) + '</td><td>' + esc(r.shipping_date) + '</td><td>' + esc((r.mrp_numbers || []).join(', ')) + '</td><td class="num">' + esc(r.total_koli) + '</td><td class="num">' + esc(r.total_qty) + '</td><td>' + (files || '—') + '</td></tr>';
      if (open[r.resi_group_id]) out += '<tr class="detail"><td colspan="8">' + detail(r) + '</td></tr>';
    });
    $('rows').innerHTML = out || '<tr><td colspan="8">Belum ada resi.</td></tr>';
    $('tbl').hidden = false;
    Array.prototype.forEach.call(document.querySelectorAll('tr.resi'), function (tr) {
      tr.onclick = function (e) { if (e.target.tagName === 'A') return; var id = tr.getAttribute('data-id'); open[id] = !open[id]; draw(rows); };
    });
  }

  function load() {
    say('Memuat…');
    var p = new URLSearchParams();
    if ($('from').value) p.set('from', $('from').value);
    if ($('to').value) p.set('to', $('to').value);
    if ($('q').value.trim()) p.set('q', $('q').value.trim());
    fetch('/api/erp-resi-list?' + p.toString(), { headers: { 'x-view-password': pw() } })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
      .then(function (x) {
        if (x.status === 401) { setPw(''); show(false); say('Kata sandi salah.', true); return; }
        if (!x.ok) { say(x.d.error || 'Gagal memuat.', true); return; }
        show(true); say(x.d.count + ' resi.'); draw(x.d.rows);
      })
      .catch(function (e) { say('Gagal terhubung: ' + e.message, true); });
  }

  $('btnLogin').onclick = function () { setPw($('pw').value); if (pw()) load(); };
  $('pw').onkeydown = function (e) { if (e.key === 'Enter') $('btnLogin').click(); };
  $('btnLoad').onclick = load;
  $('btnOut').onclick = function () { setPw(''); show(false); say(''); };
  if (pw()) { show(true); load(); }
})();
</script>
</body>
</html>
